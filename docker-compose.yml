
services:
  web:
    build: ./
    image: afonsorcarvalho/odoo:16.0-docxtpl
    tty: true
    # host.docker.internal → IP do host (Docker 20.10+). Ajuste se o seu Docker não suportar host-gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ARGS: --unccent --dev reload
      # LLM inference: usa container `ollama` (override docker-compose.ollama.yml).
      # URL configurada via parâmetro do sistema afr_llm_assistant.api_base_url
      # (Configurações > Geral > Assistente LLM) = http://ollama:11434/v1
      #
      # Para voltar ao LM Studio no host, descomentar as 3 linhas abaixo:
      # ODOO_LMSTUDIO_HOST_LAN: "192.168.0.188"
      # ODOO_LMSTUDIO_HOST_PORT: "1234"
      # ODOO_LMSTUDIO_API_BASE: "http://host.docker.internal:1234/v1,http://172.17.0.1:1234/v1"
      # queue_job: desabilita o runner HTTP (usamos queue_job_cron_jobrunner via cron threads).
      ODOO_QUEUE_JOB_CHANNELS: "root:0"
      # afr_llm_assistant: limita system prompt para caber em ctx 4096 do modelo local.
      # Total alvo dos 3 catálogos ≈ 10000 chars (~2500 tokens), sobra contexto para
      # histórico de chat (40 últimas mensagens) e output. Subir esses valores só após
      # aumentar num_ctx do modelo Ollama (custa RAM).
      ODOO_LM_CATALOG_MODELS_CHARS: "3000"
      ODOO_LM_CATALOG_FIELDS_CHARS: "4000"
      ODOO_LM_CATALOG_REPORTS_CHARS: "3000"
    command: --dev=all --log-level debug --log-handler odoo.tools.convert:DEBUG
    #command:  --log-handler odoo.tools.convert:DEBUG 
    depends_on:
      - db
    ports:
      - "8083:8069"
      - "8073:8072"
    #deploy:
    #   resources:
    #     limits:
    #        memory: 8G
    #        cpus:  '12.0'
    restart: always
    # Limita tamanho dos logs: max-size por arquivo, max-file quantidade de arquivos rotacionados
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./engenapp:/mnt/engenapp
      - ./data/odoo:/var/lib/odoo
      - ./l10n-brazil:/mnt/l10n-brazil
      - ./product-attribute:/mnt/product-attribute
      - ./OCA-dms:/mnt/oca-dms
      - ./OCA-storage:/mnt/oca-storage
      - ./OCA-queue:/mnt/oca-queue
      - ./customize-addons:/mnt/customize-addons
      - ./conf:/etc/odoo
    # Último recurso no Linux: descomente para o container usar a rede do host (LM em 127.0.0.1).
    # Exige ajustar acesso ao Odoo (porta 8069 no host) e remover/alterar o mapeamento "ports" acima.
    # network_mode: host
  ocr_worker:
    # Sidecar dedicado a processar jobs OCR enfileirados (queue_job + queue_job_cron).
    # Compartilha image, addons e DB com web; sem porta HTTP.
    image: afonsorcarvalho/odoo:16.0-docxtpl
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ARGS: --unccent
      # queue_job: desabilita runner HTTP; jobs processam via queue_job_cron_jobrunner em cron threads.
      ODOO_QUEUE_JOB_CHANNELS: "root:0"
    # Sem HTTP (workers=0); cron threads ativos processam jobs via queue_job_cron_jobrunner.
    command: --no-http --workers=0 --max-cron-threads=4 --log-level=info
    depends_on:
      - db
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./engenapp:/mnt/engenapp
      - ./data/odoo:/var/lib/odoo
      - ./l10n-brazil:/mnt/l10n-brazil
      - ./product-attribute:/mnt/product-attribute
      - ./OCA-dms:/mnt/oca-dms
      - ./OCA-storage:/mnt/oca-storage
      - ./OCA-queue:/mnt/oca-queue
      - ./conf:/etc/odoo

  ecm-search:
    # Microserviço de busca semântica. Sem porta pública — só rede interna.
    build: ./ecm_search
    tty: true
    env_file:
      - ./ecm_search/.env
    depends_on:
      - web
      - db
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./data/chroma:/data/chroma

  db:
    image: postgres:12
    command: postgres -c logging_collector=on -c log_destination=stderr
    ports:
      - "5440:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      -  ./data/postgresql:/var/lib/postgresql/data/pgdata
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "afonso@jgma.com.br"
      PGADMIN_DEFAULT_PASSWORD: "gea182803"
    ports:
      - "9002:80"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      - db
        
